name: Update Dashboard Data

on:
  schedule:
    # Run every Sunday at 03:00 Israel time (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download GTFS and process data
        run: |
          cd pipeline
          python update_data.py

      - name: Build dashboard HTML
        run: |
          cd pipeline
          python build_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update dashboard data $(date +'%Y-%m-%d')"
          git push
